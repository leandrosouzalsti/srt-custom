<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRT Motors Custom | Ao Vivo HD</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }
        video#remoteVideo {
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            display: none;
        }
        .waiting {
            color: #ffffff;
            text-align: center;
        }
        .waiting h2 {
            font-size: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .waiting h2 span { color: #e60000; }
        .waiting p { color: #777; font-size: 14px; }
    </style>
</head>
<body>

    <div class="waiting" id="waitingBox">
        <h2>SRT MOTORS <span>CUSTOM</span></h2>
        <p id="waitingText">Aguardando transmissão ao vivo...</p>
    </div>

    <video id="remoteVideo" autoplay muted playsinline></video>

    <script>
        const socket = io();
        const pathPart = window.location.pathname.replace('/', '').toLowerCase();
        const currentRoom = ['transmissao1', 'transmissao2', 'transmissao3'].includes(pathPart) ? pathPart : 'transmissao1';
        const roomLabel = currentRoom.toUpperCase().replace('TRANSMISSAO', 'TRANSMISSÃO ');

        const remoteVideo = document.getElementById('remoteVideo');
        const waitingBox = document.getElementById('waitingBox');
        document.getElementById('waitingText').innerText = `Aguardando sinal HD da ${roomLabel}...`;

        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                {
                    urls: 'turn:openrelay.metered.ca:80',
                    username: 'openrelayproject',
                    credential: 'openrelayproject'
                },
                {
                    urls: 'turn:openrelay.metered.ca:443',
                    username: 'openrelayproject',
                    credential: 'openrelayproject'
                }
            ]
        };

        let pc = null;

        function entrarNaSala() {
            socket.emit('join-room', currentRoom);
        }

        entrarNaSala();

        socket.on('rooms-status', (state) => {
            if (state[currentRoom] && remoteVideo.style.display === 'none') {
                entrarNaSala();
            } else if (!state[currentRoom]) {
                if (pc) { pc.close(); pc = null; }
                remoteVideo.style.display = 'none';
                waitingBox.style.display = 'block';
                document.getElementById('waitingText').innerText = `Transmissão encerrada. Aguardando sinal da ${roomLabel}...`;
            }
        });

        socket.on('broadcaster-ready', () => {
            entrarNaSala();
        });

        socket.on('webrtc-offer', async (data) => {
            if (pc) pc.close();
            pc = new RTCPeerConnection(rtcConfig);

            pc.ontrack = (event) => {
                waitingBox.style.display = 'none';
                remoteVideo.style.display = 'block';
                remoteVideo.srcObject = event.streams[0];
                remoteVideo.play().catch(() => {});
            };

            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('webrtc-ice-candidate', { to: data.from, candidate: event.candidate });
                }
            };

            await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            socket.emit('webrtc-answer', { to: data.from, answer });
        });

        socket.on('webrtc-ice-candidate', async (data) => {
            if (pc && data.candidate) {
                await pc.addIceCandidate(new RTCIceCandidate(data.candidate)).catch(() => {});
            }
        });
    </script>
</body>
</html>
