<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRT Motors Custom | Aplicação de Cursos</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --preto: #080808;
            --card: #121212;
            --borda: #242424;
            --vermelho: #e60000;
            --vermelho-hover: #ff1a1a;
            --branco: #ffffff;
            --cinza: #a8a8a8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body {
            background-color: var(--preto);
            background-image: radial-gradient(circle at top, #240000 0%, #080808 65%);
            color: var(--branco);
            min-height: 100vh;
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container { width: 100%; max-width: 780px; }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--vermelho);
            padding-bottom: 15px;
            margin-bottom: 22px;
        }
        .top-bar h1 { font-size: 20px; font-weight: 900; text-transform: uppercase; }
        .top-bar h1 span { color: var(--vermelho); }
        .back-btn {
            color: var(--branco);
            text-decoration: none;
            background: #1c1c1c;
            border: 1px solid #333;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .back-btn:hover { border-color: var(--vermelho); }

        .form-card {
            background: var(--card);
            border: 1px solid var(--borda);
            border-radius: 10px;
            padding: 26px;
        }
        .form-card p.desc {
            color: var(--cinza);
            font-size: 13px;
            margin-bottom: 20px;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
        label { font-size: 11px; font-weight: 800; text-transform: uppercase; color: #ddd; }
        input, select, textarea {
            background: var(--preto);
            border: 1px solid #333;
            color: var(--branco);
            padding: 12px 14px;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--vermelho); }
        textarea { resize: vertical; min-height: 85px; }

        .btn-submit {
            width: 100%;
            background: var(--vermelho);
            color: var(--branco);
            border: none;
            padding: 15px;
            border-radius: 6px;
            font-weight: 800;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 6px;
        }
        .btn-submit:hover { background: var(--vermelho-hover); }

        @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <h1>🎓 SRT MOTORS <span>CURSOS</span></h1>
            <a href="index.html" class="back-btn">← Voltar ao Início</a>
        </div>

        <div class="form-card">
            <p class="desc">Registre a aplicação do curso prático ou teórico. O resultado é enviado instantaneamente para o canal do Discord.</p>

            <form id="cursoForm">
                <div class="grid-2">
                    <div class="field">
                        <label>Nome do Aluno / Mecânico</label>
                        <input type="text" id="aluno" required placeholder="Ex: João Silva">
                    </div>
                    <div class="field">
                        <label>ID na Cidade Nobre</label>
                        <input type="text" id="idAluno" required placeholder="Ex: 1452">
                    </div>
                </div>

                <div class="grid-2">
                    <div class="field">
                        <label>Curso Aplicado</label>
                        <select id="curso" required>
                            <option value="Curso Básico de Mecânica & Reparo">🔧 Curso Básico de Mecânica & Reparo</option>
                            <option value="Curso de Tunagem & Performance">🏎️ Curso de Tunagem & Performance</option>
                            <option value="Curso de Estética & Customização">🎨 Curso de Estética & Customização</option>
                            <option value="Curso de Guincho & Resgate Externo">🚛 Curso de Guincho & Resgate Externo</option>
                            <option value="Curso de Atendimento & Orçamento VIP">💎 Curso de Atendimento & Orçamento VIP</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>Resultado</label>
                        <select id="resultado" required>
                            <option value="APROVADO">✅ APROVADO</option>
                            <option value="REPROVADO">❌ REPROVADO</option>
                        </select>
                    </div>
                </div>

                <div class="field">
                    <label>Instrutor Responsável (Nome + ID)</label>
                    <input type="text" id="instrutor" required placeholder="Ex: Carlos SRT - ID 102">
                </div>

                <div class="field">
                    <label>Observações da Avaliação</label>
                    <textarea id="observacao" placeholder="Ex: Demonstrou domínio na tabela de preços e procedimentos de bancada..."></textarea>
                </div>

                <button type="submit" class="btn-submit">🚀 Lançar Curso e Enviar ao Discord</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('cursoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.disabled = true;
            btn.innerText = 'Enviando ao Discord...';

            const payload = {
                aluno: document.getElementById('aluno').value,
                idAluno: document.getElementById('idAluno').value,
                curso: document.getElementById('curso').value,
                resultado: document.getElementById('resultado').value,
                instrutor: document.getElementById('instrutor').value,
                observacao: document.getElementById('observacao').value
            };

            try {
                const res = await fetch('/api/cursos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    alert('✅ Curso registrado e enviado para o Discord!');
                    e.target.reset();
                } else {
                    alert('Erro ao sincronizar com o Discord.');
                }
            } catch (err) {
                alert('Falha de conexão com o servidor.');
            } finally {
                btn.disabled = false;
                btn.innerText = '🚀 Lançar Curso e Enviar ao Discord';
            }
        });
    </script>

</body>
</html>
